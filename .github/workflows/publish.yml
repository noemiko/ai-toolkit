name: Publish package (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

# Serialize releases, including different versions; never cancel an active publish.
concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Resolve a published main-branch release to an immutable commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use an existing stable tag such as v0.1.0.'
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,publishedAt \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false and .publishedAt != null'
          release_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          release_version=$(git show "${release_commit}:package.json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          test "$RELEASE_TAG" = "v$release_version"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

  test:
    name: Release tests (Node ${{ matrix.node }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  publish:
    name: Publish approved version to GitHub Packages
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      - name: Publish the exact tested version using semantic-release's npm plugin
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          NPM_TOKEN: ${{ github.token }}
        run: node .github/release/publish.mjs
